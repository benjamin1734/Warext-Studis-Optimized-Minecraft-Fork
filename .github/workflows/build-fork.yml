name: Build Warext Server Engine 26.3

on:
  push:
    branches: [ "main" ]
    paths:
      - "build-tools/**"
      - ".github/workflows/build-fork.yml"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

concurrency:
  group: warext-server-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Checkout fork build repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Fetch pinned upstream 26.3 source
        run: |
          UPSTREAM_REF=$(tr -d '[:space:]' < build-tools/UPSTREAM_REF)
          git init upstream-src
          git -C upstream-src remote add origin https://github.com/Winds-Studio/Leaf.git
          git -C upstream-src fetch --depth=1 origin "$UPSTREAM_REF"
          git -C upstream-src checkout -B dev/26.3 FETCH_HEAD
          git -C upstream-src rev-parse HEAD | tee UPSTREAM_COMMIT.txt
          test "$(cat UPSTREAM_COMMIT.txt)" = "$UPSTREAM_REF"

      - name: Configure Git
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "Warext Server Engine Build"

      - name: Apply upstream patch stack
        working-directory: upstream-src
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Apply Warext performance layer
        run: python3 build-tools/patch_engine_263.py upstream-src

      - name: Build Paperclip JAR
        working-directory: upstream-src
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p artifacts
          JAR=$(find upstream-src/leaf-server/build/libs -maxdepth 1 -type f -name '*paperclip-26.3*.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" artifacts/Warext-Server-Engine-26.3.jar
          sha256sum artifacts/Warext-Server-Engine-26.3.jar > artifacts/SHA256SUMS.txt
          cp UPSTREAM_COMMIT.txt artifacts/UPSTREAM_COMMIT.txt
          cat artifacts/SHA256SUMS.txt

      - name: Smoke test balanced and extreme profiles
        run: |
          set -euo pipefail

          run_smoke() {
            PROFILE="$1"
            PORT="$2"
            DIR="smoke-$PROFILE"

            rm -rf "$DIR"
            mkdir -p "$DIR"
            cp artifacts/Warext-Server-Engine-26.3.jar "$DIR/server.jar"
            cd "$DIR"

            printf 'eula=true\n' > eula.txt
            cat > server.properties <<EOF
          online-mode=false
          server-port=$PORT
          level-type=minecraft:flat
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-players=1
          enable-query=false
          enable-rcon=false
          EOF

            mkfifo console.pipe
            exec 3<>console.pipe
            java -Dwarext.profile="$PROFILE" -Xms768M -Xmx1024M -jar server.jar nogui <console.pipe >server.log 2>&1 &
            PID=$!
            READY=0

            for i in $(seq 1 90); do
              if grep -q "Done (" server.log; then
                READY=1
                break
              fi
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Server exited before reaching Done for profile $PROFILE"
                cat server.log
                exit 1
              fi
              sleep 1
            done

            if [ "$READY" -ne 1 ]; then
              echo "Server did not reach Done within 90 seconds for profile $PROFILE"
              cat server.log
              echo "stop" >&3 || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            if [ "$PROFILE" = "balanced" ]; then
              grep -q "Async Pathfinding" server.log || {
                echo "Balanced profile did not initialize async pathfinding"
                cat server.log
                exit 1
              }
            fi

            if [ "$PROFILE" = "extreme" ]; then
              grep -q "Async Entity Tracker" server.log || {
                echo "Extreme profile did not initialize async entity tracker"
                cat server.log
                exit 1
              }
            fi

            PROFILE_UPPER=$(printf '%s' "$PROFILE" | tr '[:lower:]' '[:upper:]')
            grep -q "Warext profile: $PROFILE_UPPER" server.log || {
              echo "Profile-aware Moonrise chunk worker policy was not initialized for $PROFILE"
              grep -n "worker threads" server.log || true
              cat server.log
              exit 1
            }

            test -f config/warext-global.yml || {
              echo "Warext configuration file was not generated"
              find config -maxdepth 1 -type f -print || true
              exit 1
            }
            if [ -e config/leaf-global.yml ]; then
              echo "Legacy upstream-branded configuration filename was generated unexpectedly"
              exit 1
            fi

            if [ "$PROFILE" = "pregeneration" ]; then
              grep -A6 "chunk-io-pending-write-limit:" config/warext-global.yml | grep -q "enabled: true" || {
                echo "Pregeneration profile did not enable the chunk I/O pending-write guard"
                grep -A8 -n "chunk-io-pending-write-limit:" config/warext-global.yml || true
                cat config/warext-global.yml
                exit 1
              }

              grep -A6 "end-biome-cache:" config/warext-global.yml | grep -q "enabled: true" || {
                echo "Pregeneration profile did not enable the End biome cache"
                grep -A8 -n "end-biome-cache:" config/warext-global.yml || true
                cat config/warext-global.yml
                exit 1
              }

              # Exercise real End worldgen outside the central-island fast path so the
              # erosion-based biome resolver and Warext cache are used.
              echo "execute in minecraft:the_end run forceload add 2048 2048" >&3
              sleep 10
              kill -0 "$PID" 2>/dev/null || {
                echo "Pregeneration profile exited during End worldgen smoke"
                cat server.log
                exit 1
              }
              echo "save-all flush" >&3
              sleep 4
              if grep -Eiq "Exception|Failed to load|Failed to save|worldgen.*error|biome.*error|TheEndBiome.*error" server.log; then
                echo "End worldgen smoke emitted an error"
                cat server.log
                exit 1
              fi
              echo "execute in minecraft:the_end run forceload remove 2048 2048" >&3
            fi

            echo "warext version" >&3
            sleep 3
            grep -q "Warext Server Engine experimental build" server.log || {
              echo "Warext runtime command/brand verification failed"
              cat server.log
              exit 1
            }

            echo "stop" >&3
            for i in $(seq 1 30); do
              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if kill -0 "$PID" 2>/dev/null; then
              echo "Server did not stop cleanly for profile $PROFILE"
              cat server.log
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            wait "$PID" || true
            exec 3>&-
            grep "Done (" server.log | tail -n 1
            cd ..
          }

          run_aquifer_worldgen_smoke() {
            DIR="smoke-aquifer"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            cp artifacts/Warext-Server-Engine-26.3.jar "$DIR/server.jar"
            cd "$DIR"

            printf 'eula=true\n' > eula.txt
            printf '%s\\n' \\
              'online-mode=false' \\
              'server-port=25572' \\
              'level-seed=8675309' \\
              'level-type=minecraft:normal' \\
              'view-distance=2' \\
              'simulation-distance=2' \\
              'spawn-protection=0' \\
              'max-players=1' \\
              'enable-query=false' \\
              'enable-rcon=false' > server.properties

            mkfifo console.aquifer.pipe
            exec 6<>console.aquifer.pipe
            java -Dwarext.profile=pregeneration -Xms768M -Xmx1024M -jar server.jar nogui <console.aquifer.pipe >aquifer.log 2>&1 &
            AQUA_PID=$!

            for i in $(seq 1 120); do
              grep -q "Done (" aquifer.log && break
              kill -0 "$AQUA_PID" 2>/dev/null || { cat aquifer.log; exit 1; }
              sleep 1
            done
            grep -q "Done (" aquifer.log || {
              echo "Aquifer worldgen smoke did not reach Done"
              cat aquifer.log
              exit 1
            }

            test -f config/warext-global.yml
            grep -A5 "aquifer-center-precompute:" config/warext-global.yml | grep -q "enabled: true" || {
              echo "Pregeneration profile did not enable Aquifer center precompute"
              grep -A8 -n "aquifer-center-precompute:" config/warext-global.yml || true
              cat config/warext-global.yml
              exit 1
            }

            AQUA_SMOKE_START=$(wc -l < aquifer.log)
            echo "forceload add 512 512" >&6
            sleep 12
            kill -0 "$AQUA_PID" 2>/dev/null || {
              echo "Server exited during Aquifer worldgen smoke"
              cat aquifer.log
              exit 1
            }
            echo "save-all flush" >&6
            sleep 4

            tail -n "+$((AQUA_SMOKE_START + 1))" aquifer.log > aquifer-worldgen-smoke.log
            grep -Fq "Marked chunk [32, 32] in minecraft:overworld to be force loaded" aquifer-worldgen-smoke.log || {
              echo "Aquifer worldgen smoke did not force-load the expected chunk"
              cat aquifer-worldgen-smoke.log
              exit 1
            }
            if grep -Eiq "Exception|Failed to load|Failed to save|aquifer.*error|worldgen.*error" aquifer-worldgen-smoke.log; then
              echo "Aquifer worldgen smoke emitted an error"
              cat aquifer-worldgen-smoke.log
              exit 1
            fi

            echo "forceload remove 512 512" >&6
            echo "stop" >&6
            for i in $(seq 1 30); do
              kill -0 "$AQUA_PID" 2>/dev/null || break
              sleep 1
            done
            kill -0 "$AQUA_PID" 2>/dev/null && {
              cat aquifer.log
              kill "$AQUA_PID" || true
              exit 1
            }
            wait "$AQUA_PID" || true
            exec 6>&-
            grep "Done (" aquifer.log | tail -n 1
            cd ..
          }

          run_lazy_container_smoke() {
            DIR="smoke-balanced"
            cd "$DIR"

            grep -q "container-item-lazy-loading: false" config/warext-global.yml || {
              echo "Deferred container config option was not generated"
              grep -n "container-item-lazy-loading" config/warext-global.yml || true
              exit 1
            }
            sed -i 's/container-item-lazy-loading: false/container-item-lazy-loading: true/' config/warext-global.yml
            grep -q "container-item-lazy-loading: true" config/warext-global.yml

            # Seed an inventory NBT payload before the feature-enabled restart.
            rm -f console.lazy-seed.pipe
            mkfifo console.lazy-seed.pipe
            exec 4<>console.lazy-seed.pipe
            java -Dwarext.profile=balanced -Xms768M -Xmx1024M -jar server.jar nogui <console.lazy-seed.pipe >lazy-seed.log 2>&1 &
            SEED_PID=$!
            for i in $(seq 1 90); do
              grep -q "Done (" lazy-seed.log && break
              kill -0 "$SEED_PID" 2>/dev/null || { cat lazy-seed.log; exit 1; }
              sleep 1
            done
            grep -q "Done (" lazy-seed.log || { cat lazy-seed.log; exit 1; }
            echo "setblock 0 4 0 minecraft:chest" >&4
            echo "item replace block 0 4 0 container.0 with minecraft:stone 1" >&4
            echo "save-all flush" >&4
            sleep 3
            echo "stop" >&4
            for i in $(seq 1 30); do
              kill -0 "$SEED_PID" 2>/dev/null || break
              sleep 1
            done
            kill -0 "$SEED_PID" 2>/dev/null && { cat lazy-seed.log; kill "$SEED_PID" || true; exit 1; }
            wait "$SEED_PID" || true
            exec 4>&-

            # Restart with the saved chest present. Startup exercises lazy NBT retention;
            # the item command then forces first-access decode through the container API.
            rm -f console.lazy.pipe
            mkfifo console.lazy.pipe
            exec 5<>console.lazy.pipe
            java -Dwarext.profile=balanced -Xms768M -Xmx1024M -jar server.jar nogui <console.lazy.pipe >lazy-container.log 2>&1 &
            LAZY_PID=$!
            for i in $(seq 1 90); do
              grep -q "Done (" lazy-container.log && break
              kill -0 "$LAZY_PID" 2>/dev/null || { cat lazy-container.log; exit 1; }
              sleep 1
            done
            grep -q "Done (" lazy-container.log || { cat lazy-container.log; exit 1; }
            grep -q "ContainerItemLazyLoading.lazyContainerItemLoading" lazy-container.log || {
              echo "Experimental deferred-container module was not enabled"
              cat lazy-container.log
              exit 1
            }
            echo "item replace block 0 4 0 container.1 with minecraft:dirt 1" >&5
            echo "save-all flush" >&5
            sleep 3
            if grep -Eq "Exception|ERROR|Failed to load|Failed to save" lazy-container.log; then
              echo "Deferred-container smoke emitted an error"
              cat lazy-container.log
              exit 1
            fi
            echo "stop" >&5
            for i in $(seq 1 30); do
              kill -0 "$LAZY_PID" 2>/dev/null || break
              sleep 1
            done
            kill -0 "$LAZY_PID" 2>/dev/null && { cat lazy-container.log; kill "$LAZY_PID" || true; exit 1; }
            wait "$LAZY_PID" || true
            exec 5>&-
            grep "Done (" lazy-container.log | tail -n 1
            cd ..
          }

          run_smoke balanced 25569
          run_smoke extreme 25570
          run_smoke pregeneration 25571
          run_aquifer_worldgen_smoke
          run_lazy_container_smoke

      - name: Remove legacy product-branded prereleases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "v26.3-exp.1"
            gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("warext-optimized-26.3-build-")) | .tagName'
          } | sort -u | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Removing legacy release: $TAG"
              gh release delete "$TAG" --cleanup-tag -y
            fi
          done

      - name: Publish versioned prerelease JAR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < build-tools/VERSION)
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication."
            exit 0
          fi

          gh release create "$TAG" \
            artifacts/Warext-Server-Engine-26.3.jar \
            artifacts/SHA256SUMS.txt \
            artifacts/UPSTREAM_COMMIT.txt \
            --title "Warext Server Engine $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --prerelease


      - name: Verify published JAR asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < build-tools/VERSION)
          TAG="v$VERSION"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "Warext-Server-Engine-26.3.jar" || {
            echo "Release $TAG is missing Warext-Server-Engine-26.3.jar"
            exit 1
          }
