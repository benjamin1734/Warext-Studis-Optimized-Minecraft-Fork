name: Build Optimized Leaf 26.3 Fork

on:
  push:
    branches: [ "main", "perf-stage-2", "perf-stage-3", "perf-stage-4", "perf-stage-5" ]
    paths:
      - "build-tools/**"
      - ".github/workflows/build-fork.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout fork build repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Clone Leaf 26.3
        run: |
          git clone --branch dev/26.3 --single-branch https://github.com/Winds-Studio/Leaf.git leaf-src
          git -C leaf-src rev-parse HEAD | tee UPSTREAM_COMMIT.txt

      - name: Configure Git
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "Warext Optimized Fork Build"

      - name: Apply Leaf/Paper patch stack
        working-directory: leaf-src
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Apply Warext performance layer
        run: python3 build-tools/patch_leaf_263.py leaf-src

      - name: Build Paperclip JAR
        working-directory: leaf-src
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p artifacts
          JAR=$(find leaf-src/leaf-server/build/libs -maxdepth 1 -type f -name 'leaf-paperclip-26.3*.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" artifacts/Warext-Studis-Optimized-Leaf-26.3.jar
          sha256sum artifacts/Warext-Studis-Optimized-Leaf-26.3.jar > artifacts/SHA256SUMS.txt
          cp UPSTREAM_COMMIT.txt artifacts/UPSTREAM_COMMIT.txt
          cat artifacts/SHA256SUMS.txt

      - name: Publish prerelease JAR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="warext-optimized-26.3-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             artifacts/Warext-Studis-Optimized-Leaf-26.3.jar             artifacts/SHA256SUMS.txt             artifacts/UPSTREAM_COMMIT.txt             --title "Warext Optimized Leaf 26.3 Build ${GITHUB_RUN_NUMBER}"             --notes "Experimental performance build based on Leaf dev/26.3. Includes adaptive multi-core pathfinding/tracker work, lower tracker allocations, NodeEvaluator pool correctness, async mob-spawn recovery and save-integrity fixes. 26.3 upstream is still under development; benchmark before production deployment."             --prerelease
